{% extends 'base.html' %}{% load ui %}{% block content %}<main class="container"><form method="post" class="form-card auth-card">{% csrf_token %}<h1>{% t 'login' %}</h1><p>{% t 'login_intro' %}</p>{% if form.errors %}<p class="message error">{% t 'form_error' %}</p>{% endif %}{{ form.non_field_errors }}<div class="form-grid">{% for field in form %}<label>{% t field.name %}{{ field }}{{ field.errors }}</label>{% endfor %}</div><input type="hidden" name="next" value="{{ next }}"><button class="primary wide">{% t 'login' %}</button><p><a class="text-link" href="{% url 'register' %}">{% t 'register' %}</a></p></form></main>{% endblock %}
