
name: ticketflow

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy

services:

  # ==========================================
  # POSTGRESQL
  # ==========================================

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ticketflow}
      POSTGRES_USER: ${DB_USER:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-ticketflow} -d ${DB_NAME:-ticketflow}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # REDIS
  # ==========================================

  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ==========================================
  # DATABASE MIGRATIONS
  # ==========================================

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # ==========================================
  # PAYMENT SIMULATOR
  # ==========================================

  payment:
    <<: *app
    command: >
      gunicorn payment_service.wsgi:application
      --bind 0.0.0.0:8001
      --workers 2
      --access-logfile -
      --error-logfile -
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live/', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==========================================
  # CELERY WORKER
  # ==========================================

  celery-worker:
    <<: *app
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ==========================================
  # CELERY BEAT SCHEDULER
  # ==========================================

  celery-beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule=/app/.tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ==========================================
  # MAIN WEB APPLICATION
  # ==========================================

  web:
    <<: *app
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-18000}:8000"
    volumes:
      - uploaded_posters:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      payment:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


# ==========================================
# PERSISTENT VOLUMES
# ==========================================

volumes:
  postgres_data:
  redis_data:
  uploaded_posters:
