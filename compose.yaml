x-app: &app
  build: .
  image: ticketflow:local
  environment: &env
    DEBUG: ${DEBUG:-1}
    SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deployment}
    PAYMENT_SECRET: ${PAYMENT_SECRET:-local-simulator-only}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    DB_HOST: db
    DB_NAME: ticketflow
    DB_USER: ticketflow
    DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    PAYMENT_URL: http://payment:8001
    REDIS_URL: redis://cache:6379/0
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["python", "manage.py", "bootstrap_platform"]
    depends_on:
      db: {condition: service_healthy}
  payment:
    <<: *app
    environment:
      DEBUG: ${DEBUG:-1}
      PAYMENT_SECRET: ${PAYMENT_SECRET:-local-simulator-only}
    command: ["gunicorn", "payment_service.wsgi:application", "--bind", "0.0.0.0:8001", "--workers", "2", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live/', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  web:
    <<: *app
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
    volumes: ["uploaded_posters:/app/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      payment: {condition: service_healthy}
      cache: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  expiry-worker:
    <<: *app
    command: ["python", "manage.py", "expire_bookings", "--loop"]
    environment:
      <<: *env
      EXPIRY_HEARTBEAT: /tmp/expiry.heartbeat
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/expiry.heartbeat') < 60"]
      interval: 20s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_posters:
