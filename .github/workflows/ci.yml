name: TicketFlow CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ticketflow
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketflow -d ticketflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: ticketflow
      DB_USER: ticketflow
      DB_PASSWORD: ci-only-password
      PAYMENT_SECRET: ci-simulator-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit installed Python dependencies
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test booking payment_service --verbosity 2
      - run: python -m unittest deploy.test_release -v
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - name: Signed HTTP payment smoke test
        run: |
          gunicorn payment_service.wsgi:application --bind 127.0.0.1:8001 --daemon
          python scripts/payment_smoke.py
      - run: python manage.py collectstatic --noinput
      - name: Install browser verification tools
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke and screenshots
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --daemon
          python scripts/browser_smoke.py
          python scripts/http_smoke.py --allow-demo-data
      - name: Full isolated Playwright AQA
        run: python qa/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: |
            .tmp/screenshots/
            .tmp/qa/
      - run: docker build -t ticketflow:ci .
      - name: Compose service integration
        env:
          COMPOSE_PROJECT_NAME: ticketly-ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: '18000'
        run: |
          cp .env.example .env
          docker compose up -d --build
          python scripts/compose_smoke.py
          docker compose exec -T web python scripts/http_smoke.py --allow-demo-data
          docker compose exec -T web python scripts/admin_smoke.py --allow-demo-data
          docker compose exec -T web python scripts/container_assets_check.py
      - name: Compose logs and cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ticketly-ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: '18000'
        run: |
          docker compose logs --no-color --tail=150
          docker compose down --remove-orphans
