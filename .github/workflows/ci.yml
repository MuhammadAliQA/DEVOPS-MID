
name: TicketFlow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Do not cancel a running CI job.
concurrency:
  group: ticketflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ticketflow
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketflow -d ticketflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      SECRET_KEY: "ci-test-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: ticketflow
      DB_USER: ticketflow
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Build Docker images
        run: docker compose build

      - name: Compose service integration
        env:
          COMPOSE_PROJECT_NAME: ticketly-ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: "18000"
          WEB_BIND_IP: "127.0.0.1"
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for application
        env:
          WEB_PORT: "18000"
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              "http://127.0.0.1:${WEB_PORT}/health/ready/"; then
              echo "Application is ready"
              exit 0
            fi
            sleep 3
          done

          echo "Application did not become ready"
          exit 1

      - name: Compose logs and cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ticketly-ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: "18000"
          WEB_BIND_IP: "127.0.0.1"
        run: |
          docker compose ps
          docker compose logs --tail=100 || true
          docker compose down -v --remove-orphans || true
          rm -f .env

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticketflow-ci-artifacts
          path: |
            test-results/
            playwright-report/
            coverage/
          if-no-files-found: ignore
          retention-days: 7

