
name: TicketFlow CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Do not cancel a running CI job.
concurrency:
  group: ticketflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ticketflow
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketflow -d ticketflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Disposable HTTP test environment, not the production deployment.
      DEBUG: '1'
      SECRET_KEY: ci-only-disposable-django-key-not-for-production-use-2026
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: ticketflow
      DB_USER: ticketflow
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      PAYMENT_SECRET: ci-simulator-secret
      REDIS_URL: ''

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off
      - run: npm run build && npm run check
      - run: python manage.py collectstatic --noinput
      - name: Backend and payment tests
        shell: bash
        run: |
          mkdir -p .tmp/ci
          set -o pipefail
          python manage.py test booking payment_service --verbosity 2 2>&1 | tee .tmp/ci/backend-tests.log
      - run: python -m unittest deploy.test_release -v
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - name: Signed HTTP payment smoke test
        run: |
          gunicorn payment_service.wsgi:application --bind 127.0.0.1:8001 --daemon
          python scripts/payment_smoke.py
      - name: Install browser verification tools
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke and screenshots
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --daemon
          python scripts/browser_smoke.py
          python scripts/http_smoke.py --allow-demo-data
      - name: Full isolated Playwright AQA
        shell: bash
        run: |
          mkdir -p .tmp/ci
          set -o pipefail
          python qa/run.py 2>&1 | tee .tmp/ci/playwright.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: |
            .tmp/screenshots/
            .tmp/qa/
            .tmp/ci/
      - name: Compose service integration
        env:
          COMPOSE_PROJECT_NAME: ticketly-ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: "18000"
          WEB_BIND_IP: "127.0.0.1"
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --build
          python scripts/compose_smoke.py
          docker compose exec -T web python scripts/http_smoke.py --allow-demo-data
          docker compose exec -T web python scripts/admin_smoke.py --allow-demo-data
          docker compose exec -T web python scripts/container_assets_check.py

      - name: Compose logs and cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ticketly-ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: "18000"
          WEB_BIND_IP: "127.0.0.1"
        run: |
          if [ -f .env ]; then
            docker compose logs --no-color --tail=100
            docker compose down --remove-orphans
          fi
