[project]
name = "ticketflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.18.2,<3.19",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "psycopg[binary]>=3.2,<3.3",
    "qrcode>=8.2,<9",
    "Pillow>=13,<14",
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "whitenoise>=6.11,<7",
    "redis>=5.2,<6",
]

[project.optional-dependencies]
opencv-qr = ["opencv-python-headless>=4.10,<5"]
